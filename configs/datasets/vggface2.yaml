dataset:
  name: vggface2
  required_disk_gib: 150

  source:
    provider: kaggle-cli
    dataset_handle: hearfool/vggface2

  paths:
    download_dir: data/downloads/vggface2
    raw_dir: data/raw/vggface2
    metadata_dir: data/metadata

  extraction:
    enabled: true
    remove_archive_after_extract: false

  validation:
    enabled: true
    minimum_image_count: 190000
    minimum_identity_count: 500

    image_extensions:
      - .jpg
      - .jpeg
      - .png

  indexing:
    output_index: data/metadata/vggface2_index.parquet
    output_summary: data/metadata/vggface2_summary.json
    output_invalid_files: data/metadata/vggface2_invalid_files.csv

    validate_images: false
    checksum: false
    relative_paths: true

    image_extensions:
      - .jpg
      - .jpeg
      - .png

  split:
    seed: 42

    minimum_images_per_identity: 10

    identity_groups:
      background: 100
      development: 100
      evaluation: 340
   
    enrollment_candidate_count: 10
    default_enrollment_count: 5
    output_split: data/splits/vggface2_split.parquet
    output_summary: data/splits/vggface2_split_summary.json
experiment:
  name: facenet512_vggface2
  seed: 42

data:
  split_path: data/splits/vggface2_split.parquet
  shard_dir: data/splits/embedding_shards/facenet512
  cache_dir: data/cache/embeddings/facenet512

sharding:
  num_shards: 4
  strategy: identity_balanced
  output_summary: data/splits/embedding_shards/facenet512/shard_summary.json

face_model:
  backend: deepface
  model_name: Facenet512
  detector_backend: retinaface
  align: true
  enforce_detection: true
  normalization: Facenet2018
  max_faces: 1

extraction:
  expected_embedding_dimension: 512
  save_dtype: float32
  memory_growth: true

templates:
  output_dir: data/templates/facenet512

  enrollment_counts:
    - 1
    - 3
    - 5
    - 7
    - 10

  aggregation: median
  l2_normalize: false

feature_selection:
  output_dir: data/features/facenet512

  enrollment_counts:
    - 3
    - 5
    - 7
    - 10

  top_k: 128
  stability_weight: 0.5
  epsilon: 0.000001
  mad_scale: 1.4826
  use_leave_one_out_background: true

normalization:
  output_dir: data/normalization/facenet512

  enrollment_counts:
    - 3
    - 5
    - 7
    - 10

  lower_quantile: 25.0
  upper_quantile: 75.0
  scale_floor: 0.000001

binarization:
  output_dir: data/binary_templates/facenet512

  enrollment_counts:
    - 3
    - 5
    - 7
    - 10

  threshold: 0.0
  positive_when_greater: true
  bitorder: big

probe_templates:
  output_dir: data/probe_binary_templates/facenet512

  enrollment_counts:
    - 3
    - 5
    - 7
    - 10

  exclude_all_enrollment_candidates: true

hamming_trials:
  output_dir: data/evaluation/facenet512/hamming_trials

  enrollment_counts:
    - 3
    - 5
    - 7
    - 10

  experiment_groups:
    - development
    - evaluation

  impostor_trials_per_claimant: 1000
  random_seed: 42

  exclude_all_enrollment_candidates: true

visualization:
  output_dir: outputs/figures/facenet512

  enrollment_counts:
    - 3
    - 5
    - 7
    - 10

  curve_group: evaluation
  distribution_group: evaluation
  template_length: 128

  det_log_scale: true
  dpi: 300

correction_radius:
  output_dir: data/evaluation/facenet512/correction_radius

  enrollment_counts:
    - 3
    - 5
    - 7
    - 10

  correction_capabilities:
    - 3
    - 5
    - 7
    - 9
    - 11
    - 13
    - 15
    - 17
    - 19
    - 23
    - 31
    - 39
    - 47

  experiment_groups:
    - development
    - evaluation

  template_length: 128

fuzzy_extractor:
  output_dir: data/evaluation/facenet512/fuzzy_extractor

  source_template_length: 128
  bch_codeword_length: 127

  candidate_correction_capabilities:
    - 7
    - 15
    - 19
    - 23
    - 31
    - 39
    - 47

  preferred_correction_capabilities:
    - 23
    - 31

  digest_algorithm: sha256
  random_seed: 42

experiment:
  name: facenet512_vggface2
  seed: 42

data:
  split_path: data/splits/vggface2_split.parquet
  shard_dir: data/splits/embedding_shards/facenet512
  cache_dir: data/cache/embeddings/facenet512

sharding:
  num_shards: 4
  strategy: identity_balanced
  output_summary: data/splits/embedding_shards/facenet512/shard_summary.json

face_model:
  backend: deepface
  model_name: Facenet512
  detector_backend: retinaface
  align: true
  enforce_detection: true
  normalization: Facenet2018
  max_faces: 1

extraction:
  expected_embedding_dimension: 512
  save_dtype: float32
  memory_growth: true

templates:
  output_dir: data/templates/facenet512

  enrollment_counts:
    - 1
    - 3
    - 5
    - 7
    - 10

  aggregation: median
  l2_normalize: false

feature_selection:
  output_dir: data/features/facenet512

  enrollment_counts:
    - 3
    - 5
    - 7
    - 10

  top_k: 128
  stability_weight: 0.5
  epsilon: 0.000001
  mad_scale: 1.4826
  use_leave_one_out_background: true

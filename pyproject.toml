[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[project]
name = "fuzzy-did-experiments"
version = "0.1.0"
description = "Experimental framework for binary face templates and Fuzzy Extractor-based DID authentication"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "deepface>=0.0.90,<1.0",
    "kagglehub>=0.3,<1.0",
    "numpy>=1.26,<3.0",
    "pydantic>=2.8,<3.0",
    "PyYAML>=6.0,<7.0",
]


[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "ruff>=0.6,<1.0",
    "mypy>=1.10,<2.0",
]


[tool.hatch.build.targets.wheel]
packages = ["src/fuzzy_did"]


[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = [
    "-ra",
    "-q",
]


[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]


[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]


[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "src"
packages = ["fuzzy_did"]